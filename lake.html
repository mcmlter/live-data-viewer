<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCM Live Lake Data</title>
  <meta name="description"
    content="Interactive time-series lake buoy data for McMurdo LTER lake monitoring stations in Antarctica. Displays stage, temperature, oxygen saturation, PAR, and more." />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="app">

    <div id="controls">

      <!-- Page switcher -->
      <div class="control-group" id="page-nav-control">
        <label>Data type</label>
        <nav id="page-nav" aria-label="Data type">
          <a href="index.html" class="nav-link">Met</a>
          <a href="lake.html" class="nav-link active" aria-current="page">Lake</a>
        </nav>
      </div>

      <!-- Site selector -->
      <div class="control-group" id="station-control">
        <label>Lake sites</label>
        <div id="station-selector-wrapper">
          <button id="station-dropdown-btn" aria-haspopup="listbox" aria-expanded="false">
            <span id="station-dropdown-label">Select sites…</span>
            <svg class="chevron" viewBox="0 0 10 6" width="10" height="6">
              <path d="M0 0l5 6 5-6z" fill="currentColor" />
            </svg>
          </button>
          <ul id="station-dropdown" role="listbox" aria-multiselectable="true" hidden>
            <!-- populated by lake.js -->
          </ul>
        </div>
      </div>

      <!-- Time range presets -->
      <div class="control-group" id="time-preset-control">
        <label>Time range</label>
        <div class="button-group" id="time-presets">
          <button class="preset-btn" data-hours="24">24 h</button>
          <button class="preset-btn active" data-hours="168">7 d</button>
          <button class="preset-btn" data-hours="720">30 d</button>
          <button class="preset-btn" data-hours="all">All</button>
        </div>
      </div>

      <!-- Custom date range -->
      <div class="control-group" id="custom-range-control">
        <label>Custom range</label>
        <div id="custom-range-inputs">
          <input type="datetime-local" id="date-start" />
          <span class="range-sep">→</span>
          <input type="datetime-local" id="date-end" />
          <button id="apply-range-btn">Apply</button>
        </div>
      </div>

      <!-- Panel toggles (populated by lake.js) -->
      <div class="control-group" id="panel-toggle-control">
        <label>Panels</label>
        <div class="toggle-group"></div>
      </div>

    </div>

    <!-- Legend -->
    <div id="legend" aria-label="Site legend"></div>

    <!-- Status / error messages -->
    <div id="status-bar" aria-live="polite"></div>

    <!-- Chart panels (populated by lake.js) -->
    <div id="charts"></div>

    <!-- Tooltip -->
    <div id="tooltip" role="tooltip" aria-hidden="true"></div>

  </div><!-- /#app -->

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="shared.js"></script>
  <script src="lake.js"></script>
</body>

</html>
