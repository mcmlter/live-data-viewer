<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCM Live Weather Data</title>
  <meta name="description"
    content="Interactive time-series meteorological visualizations for McMurdo LTER weather monitoring stations in Antarctica. Displays temperature, humidity, pressure, solar radiation, and wind." />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="app">

    <div id="controls">

      <!-- Page switcher -->
      <div class="control-group" id="page-nav-control">
        <label>Data type</label>
        <nav id="page-nav" aria-label="Data type">
          <a href="index.html" class="nav-link active" aria-current="page">Met</a>
          <a href="lake.html" class="nav-link">Lake</a>
        </nav>
      </div>

      <!-- Station selector -->
      <div class="control-group" id="station-control">
        <label>Stations</label>
        <div id="station-selector-wrapper">
          <button id="station-dropdown-btn" aria-haspopup="listbox" aria-expanded="false">
            <span id="station-dropdown-label">Select stations…</span>
            <svg class="chevron" viewBox="0 0 10 6" width="10" height="6">
              <path d="M0 0l5 6 5-6z" fill="currentColor" />
            </svg>
          </button>
          <ul id="station-dropdown" role="listbox" aria-multiselectable="true" hidden>
            <!-- populated by met.js -->
          </ul>
        </div>
      </div>

      <!-- Time range presets -->
      <div class="control-group" id="time-preset-control">
        <label>Time range</label>
        <div class="button-group" id="time-presets">
          <button class="preset-btn" data-hours="24">24 h</button>
          <button class="preset-btn active" data-hours="168">7 d</button>
          <button class="preset-btn" data-hours="720">30 d</button>
          <button class="preset-btn" data-hours="all">All</button>
        </div>
      </div>

      <!-- Custom date range -->
      <div class="control-group" id="custom-range-control">
        <label>Custom range</label>
        <div id="custom-range-inputs">
          <input type="datetime-local" id="date-start" />
          <span class="range-sep">→</span>
          <input type="datetime-local" id="date-end" />
          <button id="apply-range-btn">Apply</button>
        </div>
      </div>

      <!-- Panel toggles (populated by met.js) -->
      <div class="control-group" id="panel-toggle-control">
        <label>Panels</label>
        <div class="toggle-group"></div>
      </div>

    </div>

    <!-- Legend -->
    <div id="legend" aria-label="Station legend"></div>

    <!-- Status / error messages -->
    <div id="status-bar" aria-live="polite"></div>

    <!-- Chart panels (populated by met.js) -->
    <div id="charts"></div>

    <!-- Tooltip -->
    <div id="tooltip" role="tooltip" aria-hidden="true"></div>

  </div><!-- /#app -->

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="shared.js"></script>
  <script src="met.js"></script>
  <script>
    function sendHeight() {
      // Get the actual rendered height of the body content
      const height = document.body.scrollHeight;
      // Send message to the host window
      window.parent.postMessage({ frameHeight: height }, '*');
    }

    // Send initial height on load
    window.addEventListener('load', sendHeight);

    // Send updated height if window resizes (mobile/desktop adaptivity)
    window.addEventListener('resize', sendHeight);

    // Watch for dynamic height changes (DOM modifications, dropdown toggles, user selections)
    const observer = new ResizeObserver(() => sendHeight());
    observer.observe(document.body);
  </script>
</body>

</html>
